  #########
  # Hints #
  #########
  hint_discovered_deposit_boxes:
    # Whether gourd deposit boxes (and tower clear rewards) should be hinted upon reaching their respective towers.
    'true': 50
    'false': 0
  hint_keys:
    # Whether the locations of keys should be hinted. If `linear_towers` is enabled, this is disabled.
    # `from_start` - Keys are hinted from the start, adding them to `start_hints`.
    # `when_discovered` - Keys are hinted upon reaching their respective towers.
    # `disabled` - Keys are not hinted.
    from_start: 0
    when_discovered: 50
    disabled: 0
  hint_discovered_key_locations:
    # Whether key cutters and deposits should be hinted upon reaching their respective towers.
    'true': 50
    'false': 0
  whiteboard_hints:
    # Whether whiteboard text should be replaced with random hints upon being observed from a fair distance. These hints will persist in Archipelago, but not in-game if a Whiteboard Rewrite Trap is triggered.
    'true': 50
    'false': 0
  #########
  # Traps #
  #########
  trap_percent:
    # The percentage of filler items that should be traps.
    random-range-0-100: 50
  drop_everything_trap_weight:
    # How likely it is to receive a Drop Everything Trap, where all players drop everything on them instantly.
    random-range-0-100: 50
  butterfingers_trap_weight:
    # How likely it is to receive a Butterfingers Trap, where all players drop what they are holding (not carrying) and cannot hold anything for several seconds.
    random-range-0-100: 50
  no_comms_trap_weight:
    # How likely it is to receive a No Comms Trap, where all items related to verbal communication (walkie talkie, megaphone, etc.) are warped away from all players.
    random-range-0-100: 50
  heavy_items_trap_weight:
    # How likely it is to receive a Heavy Items Trap, where all players drop what they are carrying (not holding) and cannot carry anything for several seconds.
    random-range-0-100: 50
  whiteboard_rewrite_trap_weight:
    # How likely it is to receive a Whiteboard Rewrite Trap, where all text on whiteboards is replaced with one of a select few Archipelago-defined replacements. These replacements are exact or slightly modified strings from real gameplay (useful information is changed), ensuring maximum confusion. Undiscovered whiteboards do not have their text replaced.
    # Replacements: ["dot and line, sitting, straws", “go to the ski lift”, "going for a laser", “mountain time”, "we're heading to the ramp?", “where did you go”]
    random-range-0-100: 50
  cutscene_trap_weight:
    # How likely it is to receive a Cutscene Trap, where one player at random is forced to watch the cutscene that normally plays upon pressing the buttons in the black monolith tower.
    random-range-0-100: 50
  the_mask_trap_weight:
    # How likely it is to receive a The Mask Trap, where all players are forced to wear The Mask for several seconds.
    random-range-0-100: 50
  ###########################
  # Item & Location Options #
  ###########################
  local_items: []
  non_local_items: []
  start_inventory: {}
  start_inventory_from_pool: {}
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
  item_links: []
  plando_items: []

# The Silent Gauntlet with its puzzles optional: an item opens its stage whole (0.1.3).
#
# The save must be named exactly like `name` below. Goal is the Gauntlet, so
# the seed asks for all seven stairway items. It starts with the first two,
# so a test sees two stairways open and five held shut.
name: BigWalk
game: Big Walk
requires:
  game:
    Big Walk: 0.1.2
Big Walk:
  goal: big_goodbye
  gauntlet_mode: locked_stages
  gauntlet_puzzles_required: false
  gauntlet_stages_local: true
  lock_puzzle_needs: true
  start_with_drawbridge_open: true
  start_inventory:
    Gauntlet Stage 1 Door: 1
    Gauntlet Stage 2 Door: 1

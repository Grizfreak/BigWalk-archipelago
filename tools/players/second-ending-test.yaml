# The `second_ending` goal, end to end.
#
# Slot name of its own (DomeWalk), so this seed never shares a save with
# solo-smoke: the item cursor and the reported-check ledger both live in the
# save, and two seeds in one save is how a test lies to you.
#
# IMPORTANT: the in-game save must be named exactly like `name` below — the
# hosting screen's first field is both the save name and the AP slot name.
name: DomeWalk
game: Big Walk
Big Walk:
  goal: second_ending
  deposit_locations: all
  radio_station_checks: true
  start_with_drawbridge_open: true
